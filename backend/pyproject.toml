[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal FastAPI backend: API plus static hosting for the built frontend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "email-validator>=2.2",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
